<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Alert Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e8eaed;
    --muted: #9aa0ac;
    --accent: #5b9dff;
    --accent-soft: rgba(91,157,255,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 28px 24px 16px;
    max-width: 960px;
    margin: 0 auto;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; }
  .stats {
    display: flex;
    gap: 12px;
    margin: 18px 0 6px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat b { color: var(--text); font-size: 16px; display: block; }
  .controls {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  input[type="text"], select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  main { max-width: 960px; margin: 0 auto; padding: 0 24px 60px; }
  .job {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .job-title { font-weight: 600; font-size: 15px; }
  .job-title a { color: var(--text); text-decoration: none; }
  .job-title a:hover { color: var(--accent); }
  .job-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <h1>Job Alert Dashboard</h1>
    <div class="sub">Postings caught by the poller — updated every ~5 minutes</div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="controls">
    <input type="text" id="search" placeholder="Filter by title or company...">
    <select id="sourceFilter"><option value="">All sources</option></select>
  </div>
  <main id="jobList"><div class="empty">Loading…</div></main>

<script>
async function loadJobs() {
  try {
    const res = await fetch('jobs_log.json?_=' + Date.now());
    return await res.json();
  } catch (e) {
    return [];
  }
}

function timeAgo(iso) {
  if (!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function render(jobs, filterText, sourceFilter) {
  const list = document.getElementById('jobList');
  const ft = filterText.trim().toLowerCase();
  const filtered = jobs.filter(j => {
    const matchesText = !ft || (j.title + ' ' + j.company).toLowerCase().includes(ft);
    const matchesSource = !sourceFilter || j.source === sourceFilter;
    return matchesText && matchesSource;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No postings match yet. Once the poller finds something, it\'ll show up here.</div>';
    return;
  }

  list.innerHTML = filtered.map(j => `
    <div class="job">
      <div class="job-title">
        <a href="${j.url}" target="_blank" rel="noopener">${escapeHtml(j.title || 'Untitled role')}</a>
        <span class="badge">${escapeHtml(j.source || '')}</span>
      </div>
      <div class="job-meta">${escapeHtml(j.company || '')} · ${escapeHtml(j.location || '')} · ${timeAgo(j.found_at)}</div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderStats(jobs) {
  const now = Date.now();
  const today = jobs.filter(j => now - new Date(j.found_at).getTime() < 24*3600*1000).length;
  const week = jobs.filter(j => now - new Date(j.found_at).getTime() < 7*24*3600*1000).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${jobs.length}</b>Total logged</div>
    <div class="stat"><b>${today}</b>Last 24h</div>
    <div class="stat"><b>${week}</b>Last 7 days</div>
  `;
}

(async function() {
  const jobs = await loadJobs();
  renderStats(jobs);

  const sourceSelect = document.getElementById('sourceFilter');
  const sources = [...new Set(jobs.map(j => j.source).filter(Boolean))].sort();
  sources.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sourceSelect.appendChild(opt);
  });

  const searchInput = document.getElementById('search');
  const rerender = () => render(jobs, searchInput.value, sourceSelect.value);
  searchInput.addEventListener('input', rerender);
  sourceSelect.addEventListener('change', rerender);
  rerender();
})();
</script>
</body>
</html>
