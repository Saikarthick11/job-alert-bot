name: LinkedIn Poll

on:
  schedule:
    # Every 4 hours by default — deliberately much less frequent than the
    # main Job Poll workflow, because this one costs real money per check
    # (~$0.002/job via Apify). At this cadence it comfortably fits inside
    # Apify's $5/month free platform credit. See README before lowering
    # this interval — going much more often will likely exceed the free tier.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll-linkedin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn poller
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python linkedin_poller.py

      - name: Commit updated state and log
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json docs/jobs_log.json
          git diff --staged --quiet || git commit -m "Update LinkedIn job state"
          git push
